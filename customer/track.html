<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semak Status Pesanan | KingKadKahwin</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../design/track.css">
</head>
<body>

    <div class="track-card">
        <h2 class="card-title">Semak Progress Kad</h2>
        <p class="card-subtitle">Masukkan ID Pesanan anda untuk melihat perkembangan draf.</p>

        <!-- Search Input Form -->
        <div class="search-group">
            <input type="text" id="orderInput" placeholder="Contoh: KKK-7ADB666F27" class="search-input">
            <button onclick="fetchStatus()" class="btn-search">Semak</button>
        </div>

        <!-- Result Container -->
        <div id="statusResult" class="hidden">
            <div class="details-header">
                <div class="detail-row">
                    <span class="detail-label">ID Pesanan:</span>
                    <span id="resOrderId" class="detail-id"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Pelanggan:</span>
                    <span id="resName" class="detail-name"></span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-header">
                    <span>Kemajuan:</span>
                    <span id="percentText" class="progress-percent">0%</span>
                </div>
                <div class="progress-track">
                    <div id="progressBar" class="progress-bar" style="width: 0%"></div>
                </div>
            </div>

            <!-- Timeline Steps -->
            <div id="stepsList" class="steps-list"></div>
        </div>

        <!-- Error Alert -->
        <div id="errorMessage" class="error-alert hidden"></div>
    </div>

    <p class="footer-text">&copy; KingKadKahwin. Hak Cipta Terpelihara.</p>

    <!-- Custom JavaScript -->
    <script src="../js/track.js"></script>
</body>
</html>
