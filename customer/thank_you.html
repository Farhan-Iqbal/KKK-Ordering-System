<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Submitted | KingKadKahwin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../design/customer.css">
    <style>
        .thank-you-card {
            text-align: center;
            padding: 48px 32px;
        }
        .success-icon {
            font-size: 3.5rem;
            color: #10b981;
            margin-bottom: 16px;
        }
        .order-id-badge {
            display: inline-block;
            background: #eef2ff;
            color: #4f46e5;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            margin: 16px 0 24px;
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <main class="form-card thank-you-card">
            <i class="fa-solid fa-circle-check success-icon"></i>
            <h1>Thank You!</h1>
            <p>Your order details have been successfully submitted and sent to our design team.</p>
            
            <div class="order-id-badge" id="displayOrderId">
                Order Reference: <span id="orderIdText">Loading...</span>
            </div>

            <div>
                <a href="customer.html" class="btn-primary" style="text-decoration:none;">
                    <i class="fa-solid fa-plus"></i> Submit Another Order
                </a>
            </div>
        </main>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('order_id') || 'N/A';
        document.getElementById('orderIdText').textContent = orderId;
    </script>
</body>
</html>
