<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Submitted | KingKadKahwin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .thank-you-card {
            max-width: 580px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .success-icon {
            width: 70px;
            height: 70px;
            background-color: #10b981;
            color: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin-bottom: 20px;
        }
        .order-badge {
            background-color: #eef2ff;
            color: #4f46e5;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.95rem;
        }
        .summary-card {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 18px;
            text-align: left;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.92rem;
            border-bottom: 1px dashed #dee2e6;
        }
        .summary-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="thank-you-card">
        <!-- Success Check Icon -->
        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>

        <h2 class="fw-bold mb-3 text-dark">Thank You!</h2>
        <p class="text-muted mb-3">
            Your order details have been successfully submitted and sent to our design team.
        </p>

        <!-- Order Reference Badge -->
        <div class="mb-3">
            <span class="order-badge" id="orderRefDisplay">Order Reference: N/A</span>
        </div>

        <!-- Order Details Summary -->
        <div class="summary-card mb-4">
            <h6 class="fw-bold text-dark mb-2"><i class="bi bi-file-text me-2 text-primary"></i>Order Summary</h6>
            <div class="summary-item">
                <span class="text-muted">Customer Name:</span>
                <span class="fw-semibold text-dark" id="summaryName">N/A</span>
            </div>
            <div class="summary-item">
                <span class="text-muted">Couple Name:</span>
                <span class="fw-semibold text-dark" id="summaryCouple">N/A</span>
            </div>
            <div class="summary-item">
                <span class="text-muted">Pakej / Side Option:</span>
                <span class="fw-semibold text-dark" id="summarySide">N/A</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="d-grid gap-2 col-10 mx-auto">
            <!-- WhatsApp Notification Button -->
            <a href="#" id="whatsappBtn" target="_blank" class="btn btn-success btn-lg fw-semibold shadow-sm">
                <i class="bi bi-whatsapp me-2"></i> Notify Staff on WhatsApp
            </a>

            <!-- Styled Submit Another Order Button -->
            <a href="order_form.html" class="btn btn-outline-primary btn-lg fw-semibold mt-2">
                <i class="bi bi-plus-circle me-2"></i> Submit Another Order
            </a>
        </div>
    </div>
</div>

<script>
    // Config: Staff WhatsApp number 
    const STAFF_WHATSAPP_NUMBER = "60186684036";

    // Extract Order Parameters from URL
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order_id') || "N/A";
    const customerName = urlParams.get('name') || "N/A";
    const coupleName = urlParams.get('couple') || "N/A";
    const orderSide = urlParams.get('side') || "N/A";

    // Populate UI elements
    document.getElementById('orderRefDisplay').innerText = `Order Reference: ${orderId}`;
    document.getElementById('summaryName').innerText = customerName;
    document.getElementById('summaryCouple').innerText = coupleName;
    document.getElementById('summarySide').innerText = orderSide;

    // Build dynamic WhatsApp pre-filled message
    const waText = 
`Hello KingKadKahwin Team, I have submitted my wedding card order details and deposit receipt.

📌 *ORDER DETAILS*
• *Order ID:* ${orderId}
• *Name:* ${customerName}
• *Couple:* ${coupleName}
• *Package:* ${orderSide}

Please review my order. Thank you!`;

    const encodedMessage = encodeURIComponent(waText);
    document.getElementById('whatsappBtn').href = `https://wa.me/${STAFF_WHATSAPP_NUMBER}?text=${encodedMessage}`;
</script>

</body>
</html>
